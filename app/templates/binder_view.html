<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binder</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14151a;
    --panel: #1d1f27;
    --border: #2c2f3a;
    --text: #e8e9ee;
    --muted: #8b8fa3;
    --accent: #ffcb05;
    --accent-text: #14151a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .back-link:hover { color: var(--accent); }
  h1 {
    font-size: 1.2rem;
    margin: 0;
    white-space: nowrap;
  }
  .toolbar {
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
  }
  .toolbar[hidden], .workspace[hidden] { display: none; }
  .toolbar button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.75rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .toolbar button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .toolbar button:disabled { opacity: 0.4; cursor: default; }
  #page-indicator { font-weight: 600; color: var(--text); }
  .hint { font-size: 0.78rem; color: var(--muted); }

  .workspace {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 2rem;
    padding: 2.5rem 1.5rem;
  }

  .binder-stage {
    display: flex;
    justify-content: center;
    perspective: 2200px;
    user-select: none;
  }
  .binder-frame {
    display: flex;
    align-items: stretch;
    transform-style: preserve-3d;
    transform: rotateX(3deg);
  }
  .page-slot {
    width: clamp(260px, 32vw, 480px);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 1.3rem;
    position: relative;
    box-shadow: 0 24px 48px rgba(0,0,0,0.45);
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }
  #left-page-wrap {
    border-radius: 8px 0 0 8px;
    border-right: none;
    transform-origin: right center;
  }
  #right-page-wrap {
    border-radius: 0 8px 8px 0;
    border-left: none;
    transform-origin: left center;
  }
  .page-slot.blank .pocket-grid { visibility: hidden; }
  .binder-spine-center {
    width: 24px;
    background: linear-gradient(90deg,
      #23252f, color-mix(in srgb, var(--binder-color, #3a3d4d) 55%, #3a3d4d), #23252f);
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
    z-index: 3;
  }
  .binder-spine-center .ring {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #14151a;
    border: 1px solid #565a6c;
  }
  .pocket-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.7rem;
  }
  .pocket {
    aspect-ratio: 5 / 7;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #0c0d10;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .pocket.empty {
    border-style: dashed;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 1.5rem;
  }
  .pocket.empty:hover { border-color: var(--accent); color: var(--accent); }
  .pocket.empty.placeable {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255,203,5,0.06);
    animation: pulseBorder 1.4s ease-in-out infinite;
  }
  @keyframes pulseBorder {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,203,5,0); }
    50% { box-shadow: 0 0 0 5px rgba(255,203,5,0.15); }
  }
  .pocket img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    color: transparent;
    font-size: 0;
  }
  .pocket .remove-btn {
    position: absolute;
    top: 0.15rem;
    right: 0.15rem;
    width: 1.2rem;
    height: 1.2rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(20,21,26,0.85);
    color: var(--text);
    font-size: 0.75rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pocket .remove-btn:hover { background: #ef4444; border-color: #ef4444; }
  .pocket.write-error { outline: 2px solid #ef4444; outline-offset: -2px; }

  .flip-handle {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 24px;
    cursor: grab;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .flip-handle:active { cursor: grabbing; }
  .flip-handle::before {
    content: "";
    width: 4px;
    height: 48px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--binder-color, var(--accent)) 25%, transparent);
    transition: background 0.15s ease;
  }
  .flip-handle:hover::before { background: var(--binder-color, var(--accent)); }
  #forward-handle { right: -1px; }
  #backward-handle { left: -1px; }

  #status-line { text-align: center; color: var(--muted); padding: 2rem; }

  /* --- persistent deck panel --- */
  .deck-panel {
    flex: 0 0 260px;
    max-width: 300px;
    position: sticky;
    top: 1.5rem;
  }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .deck-panel.nudge .deck-header { animation: nudge 0.3s ease; }
  .deck-header {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    cursor: pointer;
  }
  .deck-panel.expanded .deck-header {
    border-radius: 12px 12px 0 0;
    border-bottom: none;
    padding: 1rem;
  }
  .deck-stack {
    position: relative;
    width: 100px;
    height: 140px;
  }
  .deck-card {
    position: absolute;
    inset: 0;
    border-radius: 9px;
    background: #1a1c25 url("https://images.pokemontcg.io/card-back.png") center / cover no-repeat;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }
  .deck-card:nth-child(1) { transform: translate(5px, 7px) rotate(3deg); }
  .deck-card:nth-child(2) { transform: translate(2.5px, 3.5px) rotate(-2deg); }
  .deck-card:nth-child(3) { transform: translate(0, 0) rotate(0deg); }
  .deck-header:hover .deck-card:nth-child(3) { transform: translate(0, -4px) rotate(0deg); }
  .deck-hint {
    font-size: 0.88rem;
    color: var(--muted);
    text-align: center;
  }
  .deck-hint b { color: var(--text); }

  .deck-expand {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 12px 12px;
  }
  .deck-panel.expanded .deck-expand { max-height: 65vh; }
  .deck-expand-inner {
    display: flex;
    flex-direction: column;
    max-height: 65vh;
  }
  .placing-banner {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(255,203,5,0.1);
    border-bottom: 1px solid var(--border);
    padding: 0.6rem 0.8rem;
    font-size: 0.82rem;
  }
  .placing-banner[hidden] { display: none; }
  .placing-banner b { color: var(--accent); }
  .placing-banner button {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 0.2rem 0.5rem;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .placing-banner button:hover { border-color: #ef4444; color: #ef4444; }
  #picker-search {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 0.7rem 0.9rem;
    font-size: 0.9rem;
  }
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    padding: 0.55rem;
    border-bottom: 1px solid var(--border);
  }
  .filter-row select {
    flex: 1 1 auto;
    min-width: 0;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.35rem;
    font-size: 0.74rem;
  }
  #picker-list {
    overflow-y: auto;
    padding: 0.4rem;
    min-height: 0;
  }
  .picker-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.45rem;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .picker-item:hover { background: var(--bg); }
  .picker-item.selected { border-color: var(--accent); background: rgba(255,203,5,0.08); }
  .picker-item img {
    width: 30px;
    height: 42px;
    object-fit: contain;
    background: #0c0d10;
    border-radius: 3px;
    flex-shrink: 0;
    color: transparent;
    font-size: 0;
  }
  .picker-item .name { font-size: 0.85rem; font-weight: 600; }
  .picker-item .sub { font-size: 0.72rem; color: var(--muted); }
  #picker-empty { padding: 1.2rem; color: var(--muted); text-align: center; font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <a class="back-link" href="/binder">&larr; My Binders</a>
  <h1 id="binder-name">Loading…</h1>
</header>

<div class="toolbar">
  <span id="page-indicator"></span>
  <span class="hint">Drag the page edge to flip — new pages appear as you fill them</span>
</div>

<div class="workspace">
  <div class="binder-stage">
    <div class="binder-frame" id="binder-frame">
      <div class="page-slot" id="left-page-wrap">
        <div class="flip-handle" id="backward-handle"></div>
        <div class="pocket-grid" id="left-page-content"></div>
      </div>
      <div class="binder-spine-center">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="ring"></div><div class="ring"></div>
      </div>
      <div class="page-slot" id="right-page-wrap">
        <div class="pocket-grid" id="right-page-content"></div>
        <div class="flip-handle" id="forward-handle"></div>
      </div>
    </div>
  </div>

  <div class="deck-panel" id="deck-panel">
    <div class="deck-header" id="deck-header">
      <div class="deck-stack">
        <div class="deck-card"></div>
        <div class="deck-card"></div>
        <div class="deck-card"></div>
      </div>
      <div class="deck-hint" id="deck-hint">Click to browse <b id="deck-count">…</b> available cards</div>
    </div>
    <div class="deck-expand" id="deck-expand">
      <div class="deck-expand-inner">
        <div class="placing-banner" id="placing-banner" hidden>
          <span>Placing <b id="placing-name"></b></span>
          <button id="cancel-placing" type="button">Cancel</button>
        </div>
        <input id="picker-search" type="search" placeholder="Search your collection…">
        <div class="filter-row">
          <select id="filter-supertype"><option value="">All card types</option></select>
          <select id="filter-set"><option value="">All sets</option></select>
          <select id="filter-rarity"><option value="">All rarities</option></select>
          <select id="filter-element"><option value="">All elements</option></select>
        </div>
        <div id="picker-list"></div>
      </div>
    </div>
  </div>
</div>
<div id="status-line"></div>

<script>
const binderId = window.location.pathname.split("/").filter(Boolean).pop();
const SLOTS_PER_PAGE = 9;
const VARIANT_LABELS = {
  normal: "Normal", holo: "Holo", reverse_holo: "Reverse Holo",
  first_edition_normal: "1st Ed. Normal", first_edition_holo: "1st Ed. Holo",
  first_edition: "1st Edition", promo: "Promo",
};

let binderData = null;    // { binder: {...}, slots: { "page:index": {...} } }
let spreadIndex = 0;      // 0 = [null, 1]; k>=1 = [2k, 2k+1]
let selectedCard = null;  // the owned-card row chosen from the deck list, waiting for a pocket
let ownedCards = [];
const cardFilters = { set: "", rarity: "", supertype: "", type: "" };

function safeParseList(value) {
  if (!value) return [];
  try {
    const parsed = JSON.parse(value);
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}

function pagesForSpread(k) {
  return k === 0 ? [null, 1] : [2 * k, 2 * k + 1];
}

function totalSpreads(pageCount) {
  return 1 + Math.ceil(Math.max(pageCount - 1, 0) / 2);
}

async function loadBinder() {
  const res = await fetch(`/api/binders/${binderId}`);
  if (!res.ok) {
    document.getElementById("binder-name").textContent = "Binder not found";
    document.getElementById("status-line").textContent = "This binder doesn't exist.";
    document.querySelector(".toolbar").hidden = true;
    document.querySelector(".workspace").hidden = true;
    return;
  }
  binderData = await res.json();
  document.getElementById("binder-name").textContent = binderData.binder.name;
  document.title = `${binderData.binder.name} — Binder`;
  document.getElementById("binder-frame").style.setProperty("--binder-color", binderData.binder.color);
  const maxSpread = totalSpreads(binderData.binder.page_count) - 1;
  if (spreadIndex > maxSpread) spreadIndex = maxSpread;
  renderSpread();
  refreshDeckCount();
  loadOwnedFacets();
}

function pocketEl(pageNum, index) {
  const el = document.createElement("div");
  const slot = binderData.slots[`${pageNum}:${index}`];
  if (slot) {
    el.className = "pocket filled";
    const img = slot.image_filename ? `/images/${slot.image_filename}` : "";
    el.innerHTML = `
      <img loading="lazy" src="${img}" alt="${slot.name}" title="${slot.name} · #${slot.number || "?"}">
      <button class="remove-btn" type="button" title="Remove from binder">&times;</button>
    `;
    el.querySelector(".remove-btn").addEventListener("click", async e => {
      e.stopPropagation();
      const key = `${pageNum}:${index}`;
      const prevSlot = binderData.slots[key];
      delete binderData.slots[key];
      renderSpread();
      const res = await fetch(`/api/binders/${binderId}/slots/${pageNum}/${index}`, { method: "DELETE" });
      if (!res.ok) {
        binderData.slots[key] = prevSlot;
        renderSpread();
      } else {
        refreshDeckCount();
        refreshPickerIfOpen();
      }
    });
  } else {
    el.className = "pocket empty" + (selectedCard ? " placeable" : "");
    el.addEventListener("click", () => {
      if (selectedCard) {
        placeSelectedCard(pageNum, index);
      } else {
        nudgeDeckPanel();
      }
    });
  }
  return el;
}

function renderPageInto(containerId, pageNum) {
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  const wrap = el.closest(".page-slot");
  const exists = pageNum !== null && pageNum <= binderData.binder.page_count;
  wrap.classList.toggle("blank", !exists);
  if (!exists) return;
  for (let i = 0; i < SLOTS_PER_PAGE; i++) el.appendChild(pocketEl(pageNum, i));
}

function renderSpread() {
  const [leftNum, rightNum] = pagesForSpread(spreadIndex);
  renderPageInto("left-page-content", leftNum);
  renderPageInto("right-page-content", rightNum);

  const pageCount = binderData.binder.page_count;
  const maxSpread = totalSpreads(pageCount) - 1;
  const label = leftNum
    ? `Pages ${leftNum}–${Math.min(rightNum, pageCount)} of ${pageCount}`
    : `Page 1 of ${pageCount}`;
  document.getElementById("page-indicator").textContent = label;

  document.getElementById("backward-handle").style.display = spreadIndex > 0 ? "flex" : "none";
  document.getElementById("forward-handle").style.display = spreadIndex < maxSpread ? "flex" : "none";

  // clear any leftover drag transforms
  document.getElementById("left-page-wrap").style.transform = "";
  document.getElementById("right-page-wrap").style.transform = "";

  ensureBufferPage();
}

// --- drag-to-flip ---
function setupDrag(handleEl, direction) {
  handleEl.addEventListener("pointerdown", e => {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    const startX = e.clientX;
    const pageEl = direction === "forward"
      ? document.getElementById("right-page-wrap")
      : document.getElementById("left-page-wrap");
    const pageWidth = pageEl.getBoundingClientRect().width || 300;
    const maxSpread = totalSpreads(binderData.binder.page_count) - 1;
    const canFlip = direction === "forward" ? spreadIndex < maxSpread : spreadIndex > 0;
    if (!canFlip) return;

    const beforeSpread = spreadIndex;
    const afterSpread = direction === "forward" ? spreadIndex + 1 : spreadIndex - 1;
    let swapped = false;
    let maxProgress = 0;
    handleEl.setPointerCapture(e.pointerId);
    pageEl.style.transition = "none";

    // Piecewise so the flip never actually passes 180deg (which would show
    // mirrored content): angle rises 0->90 as the page turns edge-on, then
    // the content underneath is swapped to the destination spread exactly
    // at that edge-on (invisible) instant, and the angle falls 90->0 as it
    // settles flat again — now showing the new page instead of the old one.
    function applyProgress(progress) {
      const angle = progress <= 0.5 ? progress * 180 : (1 - progress) * 180;
      const signed = direction === "forward" ? -angle : angle;
      const shouldSwap = progress > 0.5;
      if (shouldSwap !== swapped) {
        swapped = shouldSwap;
        const showSpread = shouldSwap ? afterSpread : beforeSpread;
        const [l, r] = pagesForSpread(showSpread);
        renderPageInto("left-page-content", l);
        renderPageInto("right-page-content", r);
      }
      pageEl.style.transform = `rotateY(${signed}deg)`;
    }

    function onMove(ev) {
      const dx = direction === "forward" ? (startX - ev.clientX) : (ev.clientX - startX);
      const progress = Math.min(Math.max(dx / pageWidth, 0), 1);
      maxProgress = Math.max(maxProgress, progress);
      applyProgress(progress);
    }

    function onUp() {
      handleEl.releasePointerCapture(e.pointerId);
      handleEl.removeEventListener("pointermove", onMove);
      handleEl.removeEventListener("pointerup", onUp);
      pageEl.style.transition = "transform 0.18s ease";

      const wasQuickClick = maxProgress < 0.08;
      const commit = wasQuickClick ? true : swapped;

      if (wasQuickClick && !swapped) {
        // quick click with no drag: auto-play the flip instead of no-op
        const [l, r] = pagesForSpread(afterSpread);
        renderPageInto("left-page-content", l);
        renderPageInto("right-page-content", r);
      }

      pageEl.style.transform = "rotateY(0deg)";
      setTimeout(() => {
        pageEl.style.transition = "";
        spreadIndex = commit ? afterSpread : beforeSpread;
        renderSpread();
      }, 180);
    }

    handleEl.addEventListener("pointermove", onMove);
    handleEl.addEventListener("pointerup", onUp);
  });
}

setupDrag(document.getElementById("forward-handle"), "forward");
setupDrag(document.getElementById("backward-handle"), "backward");

// A page is only worth having if it (or the one before it) holds cards, so
// growth is automatic and bounded: whenever the spread currently in view is
// both the last one AND has a card on it, one more blank page is created
// so there's always somewhere to flip to next. An empty last spread gets
// no such buffer, which is what keeps forward flipping from an empty page
// disabled — there's nothing beyond it yet.
function currentSpreadHasCards(k) {
  const [l, r] = pagesForSpread(k);
  return Object.keys(binderData.slots).some(key => {
    const p = Number(key.split(":")[0]);
    return p === l || p === r;
  });
}

async function ensureBufferPage() {
  const maxSpread = totalSpreads(binderData.binder.page_count) - 1;
  if (spreadIndex !== maxSpread || !currentSpreadHasCards(spreadIndex)) return;
  const res = await fetch(`/api/binders/${binderId}/pages`, { method: "POST" });
  if (!res.ok) return;
  const data = await res.json();
  binderData.binder.page_count = data.page_count;
  renderSpread();
}

// --- persistent deck panel: click to expand, click a card, then click a pocket ---
document.getElementById("deck-header").addEventListener("click", () => {
  const panel = document.getElementById("deck-panel");
  const expanding = !panel.classList.contains("expanded");
  panel.classList.toggle("expanded", expanding);
  if (expanding) {
    document.getElementById("picker-search").value = "";
    loadOwnedCards("");
    document.getElementById("picker-search").focus();
  } else {
    cancelPlacing();
  }
});

function nudgeDeckPanel() {
  const panel = document.getElementById("deck-panel");
  panel.classList.remove("nudge");
  void panel.offsetWidth; // restart the animation if it's already mid-nudge
  panel.classList.add("nudge");
  setTimeout(() => panel.classList.remove("nudge"), 350);
  if (!panel.classList.contains("expanded")) {
    document.getElementById("deck-header").click();
  }
}

let searchDebounce;
document.getElementById("picker-search").addEventListener("input", e => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => loadOwnedCards(e.target.value.trim()), 250);
});

async function refreshDeckCount() {
  const res = await fetch(`/api/collection/cards`);
  const cards = await res.json();
  document.getElementById("deck-count").textContent = cards.length;
}

async function loadOwnedCards(search) {
  const params = new URLSearchParams({ search, ...cardFilters });
  const res = await fetch(`/api/collection/cards?${params}`);
  ownedCards = await res.json();
  renderPickerList();
}

async function loadOwnedFacets() {
  const res = await fetch(`/api/collection/facets`);
  const data = await res.json();
  document.getElementById("filter-set").innerHTML = '<option value="">All sets</option>' +
    data.sets.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
  document.getElementById("filter-rarity").innerHTML = '<option value="">All rarities</option>' +
    data.rarities.map(r => `<option value="${r}">${r}</option>`).join("");
  document.getElementById("filter-supertype").innerHTML = '<option value="">All card types</option>' +
    data.supertypes.map(s => `<option value="${s}">${s}</option>`).join("");
  document.getElementById("filter-element").innerHTML = '<option value="">All elements</option>' +
    data.types.map(t => `<option value="${t}">${t}</option>`).join("");
}

for (const [id, key] of [["filter-set", "set"], ["filter-rarity", "rarity"],
                          ["filter-supertype", "supertype"], ["filter-element", "type"]]) {
  document.getElementById(id).addEventListener("change", e => {
    cardFilters[key] = e.target.value;
    loadOwnedCards(document.getElementById("picker-search").value.trim());
  });
}

function refreshPickerIfOpen() {
  if (document.getElementById("deck-panel").classList.contains("expanded")) {
    loadOwnedCards(document.getElementById("picker-search").value.trim());
  }
}

function renderPickerList() {
  const list = document.getElementById("picker-list");
  list.innerHTML = "";
  if (!ownedCards.length) {
    list.innerHTML = '<div id="picker-empty">No matching cards free to place — everything you own is already in a binder.</div>';
    return;
  }
  ownedCards.forEach(card => {
    const item = document.createElement("div");
    item.className = "picker-item";
    if (selectedCard && selectedCard.id === card.id && selectedCard.variant === card.variant) {
      item.classList.add("selected");
    }
    const img = card.image_filename ? `/images/${card.image_filename}` : "";
    item.innerHTML = `
      <img src="${img}" alt="${card.name}">
      <div>
        <div class="name">${card.name}</div>
        <div class="sub">${card.set_name || ""} · #${card.number || "?"} · ${VARIANT_LABELS[card.variant] || card.variant} &times;${card.quantity}</div>
      </div>
    `;
    item.addEventListener("click", () => selectCard(card, item));
    list.appendChild(item);
  });
}

function selectCard(card, itemEl) {
  selectedCard = card;
  document.querySelectorAll(".picker-item.selected").forEach(el => el.classList.remove("selected"));
  itemEl.classList.add("selected");
  document.getElementById("placing-banner").hidden = false;
  document.getElementById("placing-name").textContent =
    `${card.name} (${VARIANT_LABELS[card.variant] || card.variant})`;
  updatePlaceableHighlights();
}

document.getElementById("cancel-placing").addEventListener("click", () => cancelPlacing());

function cancelPlacing() {
  selectedCard = null;
  document.getElementById("placing-banner").hidden = true;
  document.querySelectorAll(".picker-item.selected").forEach(el => el.classList.remove("selected"));
  updatePlaceableHighlights();
}

function updatePlaceableHighlights() {
  document.querySelectorAll(".pocket.empty").forEach(el => {
    el.classList.toggle("placeable", !!selectedCard);
  });
}

async function placeSelectedCard(pageNum, index) {
  if (!selectedCard) return;
  const card = selectedCard;
  cancelPlacing();

  binderData.slots[`${pageNum}:${index}`] = {
    page_number: pageNum, slot_index: index, variant: card.variant,
    card_id: card.id, name: card.name, image_filename: card.image_filename,
    set_name: card.set_name, number: card.number, rarity: card.rarity,
  };
  renderSpread();

  const params = new URLSearchParams({ card_id: card.id, variant: card.variant });
  const res = await fetch(`/api/binders/${binderId}/slots/${pageNum}/${index}?${params}`, { method: "PUT" });
  if (!res.ok) {
    delete binderData.slots[`${pageNum}:${index}`];
    renderSpread();
  }
  refreshDeckCount();
  refreshPickerIfOpen();
}

loadBinder();
</script>
</body>
</html>
