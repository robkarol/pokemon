<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binder</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14151a;
    --panel: #1d1f27;
    --border: #2c2f3a;
    --text: #e8e9ee;
    --muted: #8b8fa3;
    --accent: #ffcb05;
    --accent-text: #14151a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .back-link:hover { color: var(--accent); }
  h1 {
    font-size: 1.2rem;
    margin: 0;
    white-space: nowrap;
  }
  .toolbar {
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
  }
  .toolbar button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.75rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .toolbar button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .toolbar button:disabled { opacity: 0.4; cursor: default; }
  #page-indicator { font-weight: 600; color: var(--text); }

  .binder-stage {
    display: flex;
    justify-content: center;
    padding: 3rem 1.5rem;
    perspective: 1800px;
  }
  .binder-frame {
    display: flex;
    transform-style: preserve-3d;
    transform: rotateX(4deg);
  }
  .binder-spine {
    width: 26px;
    background: linear-gradient(180deg, #3a3d4d, #23252f);
    border-radius: 8px 0 0 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    box-shadow: inset -2px 0 6px rgba(0,0,0,0.4);
  }
  .binder-spine .ring {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #14151a;
    border: 1px solid #4a4d5d;
  }
  #binder-page {
    width: min(480px, 80vw);
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 10px 10px 0;
    padding: 1.5rem;
    box-shadow: 18px 25px 45px rgba(0,0,0,0.5);
    transform-origin: left center;
  }
  @keyframes pageFlip {
    0%   { transform: rotateY(0deg); }
    50%  { transform: rotateY(-100deg); opacity: 0.35; }
    100% { transform: rotateY(0deg); opacity: 1; }
  }
  #binder-page.flipping { animation: pageFlip 0.5s ease; }

  .pocket-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.7rem;
  }
  .pocket {
    aspect-ratio: 5 / 7;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #0c0d10;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .pocket.empty {
    border-style: dashed;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 1.6rem;
  }
  .pocket.empty:hover { border-color: var(--accent); color: var(--accent); }
  .pocket img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    color: transparent;
    font-size: 0;
  }
  .pocket .remove-btn {
    position: absolute;
    top: 0.2rem;
    right: 0.2rem;
    width: 1.3rem;
    height: 1.3rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(20,21,26,0.85);
    color: var(--text);
    font-size: 0.8rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pocket .remove-btn:hover { background: #ef4444; border-color: #ef4444; }
  .pocket.write-error { outline: 2px solid #ef4444; outline-offset: -2px; }

  #status-line { text-align: center; color: var(--muted); padding: 2rem; }

  #picker-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  #picker-modal.visible { display: flex; }
  #picker-inner {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: min(480px, 100%);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #picker-header {
    display: flex;
    gap: 0.5rem;
    padding: 1rem;
    border-bottom: 1px solid var(--border);
  }
  #picker-search {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.7rem;
    font-size: 0.9rem;
  }
  #picker-close {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    width: 2.2rem;
    cursor: pointer;
    font-size: 1rem;
  }
  #picker-list {
    overflow-y: auto;
    padding: 0.5rem;
  }
  .picker-item {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.5rem;
    border-radius: 8px;
    cursor: pointer;
  }
  .picker-item:hover { background: var(--bg); }
  .picker-item img {
    width: 34px;
    height: 47px;
    object-fit: contain;
    background: #0c0d10;
    border-radius: 3px;
    flex-shrink: 0;
    color: transparent;
    font-size: 0;
  }
  .picker-item .name { font-size: 0.9rem; font-weight: 600; }
  .picker-item .sub { font-size: 0.75rem; color: var(--muted); }
  #picker-empty { padding: 1.5rem; color: var(--muted); text-align: center; font-size: 0.9rem; }
</style>
</head>
<body>

<header>
  <a class="back-link" href="/binder">&larr; My Binders</a>
  <h1 id="binder-name">Loading…</h1>
</header>

<div class="toolbar">
  <button id="prev-page" type="button">&larr; Prev</button>
  <span id="page-indicator"></span>
  <button id="next-page" type="button">Next &rarr;</button>
  <span style="flex:1"></span>
  <button id="add-page" type="button">+ Add Page</button>
  <button id="remove-page" type="button">&minus; Remove Last Page</button>
</div>

<div class="binder-stage">
  <div class="binder-frame">
    <div class="binder-spine">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="ring"></div><div class="ring"></div>
    </div>
    <div id="binder-page">
      <div class="pocket-grid" id="pocket-grid"></div>
    </div>
  </div>
</div>
<div id="status-line"></div>

<div id="picker-modal">
  <div id="picker-inner">
    <div id="picker-header">
      <input id="picker-search" type="search" placeholder="Search your collection…">
      <button id="picker-close" type="button">&times;</button>
    </div>
    <div id="picker-list"></div>
  </div>
</div>

<script>
const binderId = window.location.pathname.split("/").filter(Boolean).pop();
const SLOTS_PER_PAGE = 9;

let binderData = null;   // { binder: {...}, slots: { "page:index": {...} } }
let currentPage = 1;
let pendingSlotIndex = null;
let ownedCards = [];

function safeParseList(value) {
  if (!value) return [];
  try {
    const parsed = JSON.parse(value);
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}

async function loadBinder() {
  const res = await fetch(`/api/binders/${binderId}`);
  if (!res.ok) {
    document.getElementById("binder-name").textContent = "Binder not found";
    document.getElementById("status-line").textContent = "This binder doesn't exist.";
    document.querySelector(".toolbar").hidden = true;
    document.querySelector(".binder-stage").hidden = true;
    return;
  }
  binderData = await res.json();
  document.getElementById("binder-name").textContent = binderData.binder.name;
  document.title = `${binderData.binder.name} — Binder`;
  if (currentPage > binderData.binder.page_count) currentPage = binderData.binder.page_count;
  renderPage();
}

function renderPage() {
  const grid = document.getElementById("pocket-grid");
  grid.innerHTML = "";
  for (let i = 0; i < SLOTS_PER_PAGE; i++) {
    grid.appendChild(pocketEl(i));
  }
  const pageCount = binderData.binder.page_count;
  document.getElementById("page-indicator").textContent = `Page ${currentPage} / ${pageCount}`;
  document.getElementById("prev-page").disabled = currentPage <= 1;
  document.getElementById("next-page").disabled = currentPage >= pageCount;
  document.getElementById("remove-page").disabled = pageCount <= 1;
}

function pocketEl(index) {
  const el = document.createElement("div");
  const slot = binderData.slots[`${currentPage}:${index}`];
  if (slot) {
    el.className = "pocket filled";
    const img = slot.image_filename ? `/images/${slot.image_filename}` : "";
    el.innerHTML = `
      <img loading="lazy" src="${img}" alt="${slot.name}" title="${slot.name} · #${slot.number || "?"}">
      <button class="remove-btn" type="button" title="Remove from binder">&times;</button>
    `;
    el.querySelector(".remove-btn").addEventListener("click", async e => {
      e.stopPropagation();
      const key = `${currentPage}:${index}`;
      const prevSlot = binderData.slots[key];
      delete binderData.slots[key];
      renderPage();
      const res = await fetch(`/api/binders/${binderId}/slots/${currentPage}/${index}`, { method: "DELETE" });
      if (!res.ok) {
        binderData.slots[key] = prevSlot;
        renderPage();
      }
    });
  } else {
    el.className = "pocket empty";
    el.textContent = "+";
    el.addEventListener("click", () => openPicker(index));
  }
  return el;
}

async function flipToPage(newPage) {
  const pageEl = document.getElementById("binder-page");
  pageEl.classList.add("flipping");
  setTimeout(() => {
    currentPage = newPage;
    renderPage();
  }, 250);
  setTimeout(() => pageEl.classList.remove("flipping"), 500);
}

document.getElementById("prev-page").addEventListener("click", () => {
  if (currentPage > 1) flipToPage(currentPage - 1);
});
document.getElementById("next-page").addEventListener("click", () => {
  if (currentPage < binderData.binder.page_count) flipToPage(currentPage + 1);
});

document.getElementById("add-page").addEventListener("click", async () => {
  const res = await fetch(`/api/binders/${binderId}/pages`, { method: "POST" });
  const data = await res.json();
  binderData.binder.page_count = data.page_count;
  flipToPage(data.page_count);
});

document.getElementById("remove-page").addEventListener("click", async () => {
  const pageCount = binderData.binder.page_count;
  const hasCards = Object.keys(binderData.slots).some(key => key.startsWith(`${pageCount}:`));
  if (hasCards && !confirm(`Page ${pageCount} has cards in it. Remove it and its cards anyway?`)) return;
  const res = await fetch(`/api/binders/${binderId}/pages/last`, { method: "DELETE" });
  const data = await res.json();
  if (data.removed) {
    Object.keys(binderData.slots).forEach(key => {
      if (key.startsWith(`${pageCount}:`)) delete binderData.slots[key];
    });
    binderData.binder.page_count = data.page_count;
    if (currentPage > data.page_count) currentPage = data.page_count;
    renderPage();
  }
});

// --- card picker ---
function openPicker(slotIndex) {
  pendingSlotIndex = slotIndex;
  document.getElementById("picker-modal").classList.add("visible");
  document.getElementById("picker-search").value = "";
  document.getElementById("picker-search").focus();
  loadOwnedCards("");
}

function closePicker() {
  document.getElementById("picker-modal").classList.remove("visible");
  pendingSlotIndex = null;
}

document.getElementById("picker-close").addEventListener("click", closePicker);
document.getElementById("picker-modal").addEventListener("click", e => {
  if (e.target.id === "picker-modal") closePicker();
});

let searchDebounce;
document.getElementById("picker-search").addEventListener("input", e => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => loadOwnedCards(e.target.value.trim()), 250);
});

async function loadOwnedCards(search) {
  const res = await fetch(`/api/collection/cards?search=${encodeURIComponent(search)}`);
  ownedCards = await res.json();
  renderPickerList();
}

const VARIANT_LABELS = { normal: "Normal", reverse_holo: "Reverse Holo" };

function renderPickerList() {
  const list = document.getElementById("picker-list");
  list.innerHTML = "";
  if (!ownedCards.length) {
    list.innerHTML = '<div id="picker-empty">No matching cards in your collection.</div>';
    return;
  }
  ownedCards.forEach(card => {
    const item = document.createElement("div");
    item.className = "picker-item";
    const img = card.image_filename ? `/images/${card.image_filename}` : "";
    item.innerHTML = `
      <img src="${img}" alt="${card.name}">
      <div>
        <div class="name">${card.name}</div>
        <div class="sub">${card.set_name || ""} · #${card.number || "?"} · ${VARIANT_LABELS[card.variant] || card.variant} &times;${card.quantity}</div>
      </div>
    `;
    item.addEventListener("click", () => assignCard(card));
    list.appendChild(item);
  });
}

async function assignCard(card) {
  if (pendingSlotIndex === null) return;
  const slotIndex = pendingSlotIndex;
  closePicker();

  binderData.slots[`${currentPage}:${slotIndex}`] = {
    page_number: currentPage, slot_index: slotIndex, variant: card.variant,
    card_id: card.id, name: card.name, image_filename: card.image_filename,
    set_name: card.set_name, number: card.number, rarity: card.rarity,
  };
  renderPage();

  const params = new URLSearchParams({ card_id: card.id, variant: card.variant });
  const res = await fetch(`/api/binders/${binderId}/slots/${currentPage}/${slotIndex}?${params}`, { method: "PUT" });
  if (!res.ok) {
    delete binderData.slots[`${currentPage}:${slotIndex}`];
    renderPage();
  }
}

loadBinder();
</script>
</body>
</html>
