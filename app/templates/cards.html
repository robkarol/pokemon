<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokemon Card Gallery</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14151a;
    --panel: #1d1f27;
    --border: #2c2f3a;
    --text: #e8e9ee;
    --muted: #8b8fa3;
    --accent: #ffcb05;
    --accent-text: #14151a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0;
    white-space: nowrap;
  }
  h1 .accent { color: var(--accent); }
  #sync-banner {
    font-size: 0.85rem;
    color: var(--muted);
    padding: 0.4rem 0.75rem;
    border-radius: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    display: none;
    align-items: center;
    gap: 0.6rem;
  }
  #sync-banner.visible { display: flex; }
  #sync-banner button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    padding: 0.3rem 0.7rem;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.8rem;
  }
  .filters {
    padding: 1rem 1.5rem;
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .filters input, .filters select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.45rem 0.6rem;
    font-size: 0.9rem;
  }
  #search { min-width: 220px; flex: 1 1 220px; }
  #result-count {
    padding: 0 1.5rem;
    margin: 0.75rem 0 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.9rem;
    padding: 1rem 1.5rem 3rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card img {
    width: 100%;
    aspect-ratio: 5 / 7;
    object-fit: contain;
    background: #0c0d10;
    display: block;
  }
  .card .meta {
    padding: 0.5rem 0.6rem 0.65rem;
  }
  .card .name {
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .sub {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }
  #sentinel { height: 1px; }
  #status-line {
    text-align: center;
    color: var(--muted);
    padding: 1.5rem;
    font-size: 0.85rem;
  }
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 100;
    overflow-y: auto;
  }
  #lightbox.visible { display: flex; }
  #lightbox-inner {
    margin: auto;
    display: flex;
    gap: 1.75rem;
    max-width: 880px;
    width: 100%;
    padding: 4.5rem 1.5rem 3rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  #lightbox-img-wrap { flex: 1 1 300px; max-width: 360px; }
  #lightbox-img {
    width: 100%;
    border-radius: 14px;
    display: block;
  }
  #lightbox-details {
    flex: 1 1 260px;
    max-width: 400px;
    color: var(--text);
  }
  #lightbox-details h2 {
    margin: 0 0 0.2rem;
    font-size: 1.4rem;
  }
  #lightbox-details .set-line {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1rem;
  }
  #lightbox-details dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.5rem 1rem;
    margin: 0;
    font-size: 0.9rem;
  }
  #lightbox-details dt {
    color: var(--muted);
  }
  #lightbox-details dd {
    margin: 0;
  }
  .lightbox-btn {
    position: fixed;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    z-index: 101;
  }
  .lightbox-btn:hover { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .lightbox-btn:disabled { opacity: 0.25; cursor: default; background: rgba(255,255,255,0.08); color: var(--text); }
  .lightbox-nav {
    top: 50%;
    transform: translateY(-50%);
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 50%;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #lightbox-prev { left: 0.75rem; }
  #lightbox-next { right: 0.75rem; }
  #lightbox-close {
    top: 0.75rem;
    right: 0.75rem;
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 50%;
    font-size: 1.1rem;
    line-height: 1;
  }
</style>
</head>
<body>

<header>
  <h1>Poke<span class="accent">mon</span> Card Gallery</h1>
  <div id="sync-banner">
    <span id="sync-text"></span>
    <button id="sync-btn" type="button">Sync now</button>
  </div>
</header>

<div class="filters">
  <input id="search" type="search" placeholder="Search card name…">
  <select id="filter-supertype"><option value="">All card types</option></select>
  <select id="filter-set"><option value="">All sets</option></select>
  <select id="filter-rarity"><option value="">All rarities</option></select>
  <select id="filter-type"><option value="">All elemental types</option></select>
  <select id="sort-field">
    <option value="set">Sort: Set</option>
    <option value="name">Sort: Name</option>
    <option value="number">Sort: Card #</option>
    <option value="rarity">Sort: Rarity</option>
    <option value="hp">Sort: HP</option>
  </select>
  <select id="sort-order">
    <option value="asc">Ascending</option>
    <option value="desc">Descending</option>
  </select>
</div>

<p id="result-count"></p>
<div id="grid"></div>
<div id="status-line"></div>
<div id="sentinel"></div>

<div id="lightbox">
  <button id="lightbox-close" class="lightbox-btn" type="button" aria-label="Close">✕</button>
  <button id="lightbox-prev" class="lightbox-btn lightbox-nav" type="button" aria-label="Previous card">‹</button>
  <button id="lightbox-next" class="lightbox-btn lightbox-nav" type="button" aria-label="Next card">›</button>
  <div id="lightbox-inner">
    <div id="lightbox-img-wrap">
      <img id="lightbox-img" src="" alt="">
    </div>
    <div id="lightbox-details">
      <h2 id="d-name"></h2>
      <div class="set-line" id="d-set-line"></div>
      <dl id="d-meta"></dl>
    </div>
  </div>
</div>

<script>
const state = { search: "", set: "", rarity: "", supertype: "", type: "", sort: "set", order: "asc", page: 1 };
let pages = 1;
let loading = false;
let syncWasRunning = false;
let loadedCards = [];
let currentIndex = -1;

const grid = document.getElementById("grid");
const statusLine = document.getElementById("status-line");
const resultCount = document.getElementById("result-count");

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

async function loadFacets() {
  const res = await fetch("/api/facets");
  const data = await res.json();

  const setSel = document.getElementById("filter-set");
  setSel.innerHTML = '<option value="">All sets</option>' +
    data.sets.map(s => `<option value="${s.id}">${s.name} (${s.card_count})</option>`).join("");

  const raritySel = document.getElementById("filter-rarity");
  raritySel.innerHTML = '<option value="">All rarities</option>' +
    data.rarities.map(r => `<option value="${r}">${r}</option>`).join("");

  const supertypeSel = document.getElementById("filter-supertype");
  supertypeSel.innerHTML = '<option value="">All card types</option>' +
    data.supertypes.map(s => `<option value="${s}">${s}</option>`).join("");

  const typeSel = document.getElementById("filter-type");
  typeSel.innerHTML = '<option value="">All elemental types</option>' +
    data.types.map(t => `<option value="${t}">${t}</option>`).join("");
}

function cardEl(card, index) {
  const el = document.createElement("div");
  el.className = "card";
  const img = card.image_filename ? `/images/${card.image_filename}` : "";
  el.innerHTML = `
    <img loading="lazy" src="${img}" alt="${card.name}">
    <div class="meta">
      <div class="name">${card.name}</div>
      <div class="sub">${card.set_name || ""} · #${card.number || "?"}</div>
    </div>
  `;
  el.addEventListener("click", () => openLightboxAt(index));
  return el;
}

function safeParseList(value) {
  if (!value) return [];
  try {
    const parsed = JSON.parse(value);
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}

function renderLightbox(card) {
  document.getElementById("lightbox-img").src = card.image_filename ? `/images/${card.image_filename}` : "";
  document.getElementById("lightbox-img").alt = card.name || "";
  document.getElementById("d-name").textContent = card.name || "";
  document.getElementById("d-set-line").textContent =
    [card.set_name, card.series].filter(Boolean).join(" · ") || "";

  const types = safeParseList(card.types);
  const subtypes = safeParseList(card.subtypes);
  const rows = [
    ["Card #", card.number],
    ["Supertype", card.supertype],
    ["Subtypes", subtypes.join(", ")],
    ["Types", types.join(", ")],
    ["HP", card.hp],
    ["Rarity", card.rarity],
    ["Artist", card.artist],
  ].filter(([, value]) => value);

  document.getElementById("d-meta").innerHTML =
    rows.map(([label, value]) => `<dt>${label}</dt><dd>${value}</dd>`).join("");

  document.getElementById("lightbox-prev").disabled = currentIndex <= 0;
  document.getElementById("lightbox-next").disabled =
    currentIndex >= loadedCards.length - 1 && state.page > pages;
}

async function openLightboxAt(index) {
  if (index < 0) return;
  if (index >= loadedCards.length) {
    if (state.page > pages) return;
    await loadMore();
    if (index >= loadedCards.length) return;
  }
  currentIndex = index;
  renderLightbox(loadedCards[currentIndex]);
  document.getElementById("lightbox").classList.add("visible");
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("visible");
  document.body.style.overflow = "";
}

document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target.id === "lightbox") closeLightbox();
});
document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
document.getElementById("lightbox-prev").addEventListener("click", () => openLightboxAt(currentIndex - 1));
document.getElementById("lightbox-next").addEventListener("click", () => openLightboxAt(currentIndex + 1));

document.addEventListener("keydown", e => {
  if (!document.getElementById("lightbox").classList.contains("visible")) return;
  if (e.key === "Escape") closeLightbox();
  else if (e.key === "ArrowLeft") openLightboxAt(currentIndex - 1);
  else if (e.key === "ArrowRight") openLightboxAt(currentIndex + 1);
});

async function resetAndLoad() {
  state.page = 1;
  grid.innerHTML = "";
  loadedCards = [];
  currentIndex = -1;
  await loadMore();
}

async function loadMore() {
  if (loading || state.page > pages) return;
  loading = true;
  statusLine.textContent = "Loading…";

  const params = new URLSearchParams({
    search: state.search, set: state.set, rarity: state.rarity,
    supertype: state.supertype, type: state.type,
    sort: state.sort, order: state.order,
    page: state.page, page_size: 60,
  });
  const res = await fetch(`/api/cards?${params}`);
  const data = await res.json();
  pages = data.pages;

  resultCount.textContent = `${data.total.toLocaleString()} card${data.total === 1 ? "" : "s"}`;
  data.items.forEach(card => {
    const index = loadedCards.length;
    loadedCards.push(card);
    grid.appendChild(cardEl(card, index));
  });

  statusLine.textContent = state.page >= pages ? (data.total ? "End of results" : "No cards match") : "";
  state.page += 1;
  loading = false;
}

const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) loadMore();
}, { rootMargin: "600px" });
observer.observe(document.getElementById("sentinel"));

document.getElementById("search").addEventListener("input", debounce(e => {
  state.search = e.target.value;
  resetAndLoad();
}, 300));

for (const [id, key] of [["filter-set", "set"], ["filter-rarity", "rarity"],
                          ["filter-supertype", "supertype"], ["filter-type", "type"],
                          ["sort-field", "sort"], ["sort-order", "order"]]) {
  document.getElementById(id).addEventListener("change", e => {
    state[key] = e.target.value;
    resetAndLoad();
  });
}

async function pollSyncStatus() {
  const res = await fetch("/api/sync-status");
  const s = await res.json();
  const banner = document.getElementById("sync-banner");
  const text = document.getElementById("sync-text");

  if (s.running) {
    syncWasRunning = true;
    const setProgress = s.total_sets ? ` (set ${s.sets_done}/${s.total_sets}${s.current_set ? ": " + s.current_set : ""})` : "";
    text.textContent = `Syncing card data…${setProgress} ${s.cards_synced.toLocaleString()} cards, ${s.images_downloaded.toLocaleString()} images downloaded`;
    banner.classList.add("visible");
  } else if (syncWasRunning) {
    syncWasRunning = false;
    text.textContent = s.last_error ? `Sync failed: ${s.last_error}` : "Sync complete";
    banner.classList.add("visible");
    loadFacets();
    resetAndLoad();
    setTimeout(() => banner.classList.remove("visible"), 6000);
  } else if (!s.last_synced) {
    text.textContent = "No cards cached yet.";
    banner.classList.add("visible");
  }
}

document.getElementById("sync-btn").addEventListener("click", async () => {
  await fetch("/api/sync", { method: "POST" });
  pollSyncStatus();
});

loadFacets();
resetAndLoad();
pollSyncStatus();
setInterval(pollSyncStatus, 4000);
</script>
</body>
</html>
