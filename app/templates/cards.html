<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokemon Card Gallery</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14151a;
    --panel: #1d1f27;
    --border: #2c2f3a;
    --text: #e8e9ee;
    --muted: #8b8fa3;
    --accent: #ffcb05;
    --accent-text: #14151a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0;
    white-space: nowrap;
  }
  h1 .accent { color: var(--accent); }
  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .back-link:hover { color: var(--accent); }
  #sync-banner {
    font-size: 0.85rem;
    color: var(--muted);
    padding: 0.4rem 0.75rem;
    border-radius: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    display: none;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.25rem;
  }
  #sync-banner.visible { display: flex; }
  .filters {
    padding: 1rem 1.5rem;
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .filters input, .filters select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.45rem 0.6rem;
    font-size: 0.9rem;
  }
  #search { min-width: 220px; flex: 1 1 220px; }
  #master-set-link {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.45rem 0.6rem;
    font-size: 0.85rem;
    text-decoration: none;
    white-space: nowrap;
  }
  #master-set-link:hover { border-color: var(--accent); color: var(--accent); }
  .owned-toggle {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }
  .owned-toggle input { width: 1rem; height: 1rem; cursor: pointer; }
  .sync-row {
    padding: 0.6rem 1.5rem;
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem;
    color: var(--muted);
  }
  .sync-row button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.35rem 0.7rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .sync-row button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .sync-row button:disabled { opacity: 0.5; cursor: default; }
  #result-count {
    padding: 0 1.5rem;
    margin: 0.75rem 0 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.9rem;
    padding: 1rem 1.5rem 3rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card-img-wrap { position: relative; }
  .card img {
    width: 100%;
    aspect-ratio: 5 / 7;
    object-fit: contain;
    background: #0c0d10;
    display: block;
  }
  .card .meta {
    padding: 0.5rem 0.6rem 0.65rem;
  }
  .badges {
    position: absolute;
    top: 0.4rem;
    left: 0.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    align-items: flex-start;
  }
  .owned-badge {
    background: var(--variant-color, var(--accent));
    color: var(--variant-text, var(--accent-text));
    font-size: 0.75rem;
    font-weight: 700;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
  }
  .card.write-error .card-img-wrap {
    outline: 2px solid #ef4444;
    outline-offset: -2px;
  }
  .add-buttons {
    position: absolute;
    top: 0.4rem;
    right: 0.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    align-items: flex-end;
  }
  .add-btn {
    width: 1.5rem;
    height: 1.5rem;
    border-radius: 50%;
    border: 1px solid var(--variant-color, var(--border));
    background: rgba(20,21,26,0.8);
    color: var(--variant-color, var(--text));
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .add-btn:hover { background: var(--variant-color, var(--accent)); color: var(--variant-text, var(--accent-text)); }
  .card .name {
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .sub {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }
  #sentinel { height: 1px; }
  #status-line {
    text-align: center;
    color: var(--muted);
    padding: 1.5rem;
    font-size: 0.85rem;
  }
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 100;
    overflow-y: auto;
  }
  #lightbox.visible { display: flex; }
  #lightbox-inner {
    margin: auto;
    display: flex;
    gap: 1.75rem;
    max-width: 880px;
    width: 100%;
    padding: 4.5rem 1.5rem 3rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  #lightbox-img-wrap { flex: 1 1 300px; max-width: 360px; }
  #lightbox-img {
    width: 100%;
    aspect-ratio: 5 / 7;
    object-fit: contain;
    background: #0c0d10;
    border-radius: 14px;
    display: block;
    color: transparent;
  }
  #lightbox-details {
    flex: 1 1 260px;
    max-width: 400px;
    color: var(--text);
  }
  #lightbox-details h2 {
    margin: 0 0 0.2rem;
    font-size: 1.4rem;
  }
  #lightbox-details .set-line {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1rem;
  }
  #lightbox-collection {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem 0.8rem;
    margin-bottom: 1.1rem;
  }
  #lightbox-collection.write-error { outline: 2px solid #ef4444; outline-offset: -2px; }
  .qty-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .qty-row .label {
    font-size: 0.85rem;
    color: var(--variant-color, var(--muted));
    margin-right: auto;
    font-weight: 600;
  }
  .qty-row button {
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qty-row button:hover {
    background: var(--variant-color, var(--accent));
    color: var(--variant-text, var(--accent-text));
    border-color: var(--variant-color, var(--accent));
  }
  .qty-row .qty-value {
    min-width: 1.6rem;
    text-align: center;
    font-weight: 700;
    font-size: 1.05rem;
  }
  #lightbox-details dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.5rem 1rem;
    margin: 0;
    font-size: 0.9rem;
  }
  #lightbox-details dt {
    color: var(--muted);
  }
  #lightbox-details dd {
    margin: 0;
  }
  .lightbox-btn {
    position: fixed;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    z-index: 101;
  }
  .lightbox-btn:hover { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .lightbox-btn:disabled { opacity: 0.25; cursor: default; background: rgba(255,255,255,0.08); color: var(--text); }
  .lightbox-nav {
    top: 50%;
    transform: translateY(-50%);
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 50%;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #lightbox-prev { left: 0.75rem; }
  #lightbox-next { right: 0.75rem; }
  #lightbox-close {
    top: 0.75rem;
    right: 0.75rem;
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 50%;
    font-size: 1.1rem;
    line-height: 1;
  }
</style>
</head>
<body>

<header>
  <h1>Poke<span class="accent">mon</span> Card Gallery</h1>
  <a class="back-link" href="/binder">📁 My Binders</a>
  <div id="sync-banner"></div>
</header>

<div class="sync-row">
  <button id="sync-en-btn" type="button">Resync English cards</button>
  <button id="sync-tcgdex-btn" type="button">Add Japanese &amp; Thai cards</button>
  <span id="sync-status-text"></span>
</div>

<div class="filters">
  <input id="search" type="search" placeholder="Search card name…">
  <select id="filter-supertype"><option value="">All card types</option></select>
  <select id="filter-set"><option value="">All sets</option></select>
  <a id="master-set-link" href="#" target="_blank" rel="noopener" hidden>📋 Master set</a>
  <select id="filter-rarity"><option value="">All rarities</option></select>
  <select id="filter-type"><option value="">All elemental types</option></select>
  <select id="filter-language"><option value="">All languages</option></select>
  <select id="filter-has-variant">
    <option value="">Any print variant</option>
    <option value="reverse_holo">Has reverse holo</option>
    <option value="holo">Has holo</option>
    <option value="first_edition_normal">Has 1st ed. normal</option>
    <option value="first_edition_holo">Has 1st ed. holo</option>
    <option value="promo">Has promo</option>
  </select>
  <select id="sort-field">
    <option value="set">Sort: Set</option>
    <option value="name">Sort: Name</option>
    <option value="number">Sort: Card #</option>
    <option value="pokedex">Sort: Pokédex #</option>
    <option value="rarity">Sort: Rarity</option>
    <option value="hp">Sort: HP</option>
  </select>
  <select id="sort-order">
    <option value="asc">Ascending</option>
    <option value="desc">Descending</option>
  </select>
  <label class="owned-toggle">
    <input type="checkbox" id="filter-owned">
    My collection
  </label>
</div>

<p id="result-count"></p>
<div id="grid"></div>
<div id="status-line"></div>
<div id="sentinel"></div>

<div id="lightbox">
  <button id="lightbox-close" class="lightbox-btn" type="button" aria-label="Close">✕</button>
  <button id="lightbox-prev" class="lightbox-btn lightbox-nav" type="button" aria-label="Previous card">‹</button>
  <button id="lightbox-next" class="lightbox-btn lightbox-nav" type="button" aria-label="Next card">›</button>
  <div id="lightbox-inner">
    <div id="lightbox-img-wrap">
      <img id="lightbox-img" src="" alt="">
    </div>
    <div id="lightbox-details">
      <h2 id="d-name"></h2>
      <div class="set-line" id="d-set-line"></div>
      <div id="lightbox-collection"></div>
      <dl id="d-meta"></dl>
    </div>
  </div>
</div>

<script>
const state = {
  search: "", set: "", rarity: "", supertype: "", type: "", language: "en", hasVariant: "", owned: false,
  sort: "set", order: "asc", page: 1,
};
let pages = 1;
let loading = false;
let pokemontcgWasRunning = false;
let tcgdexWasRunning = false;
let loadedCards = [];
let currentIndex = -1;

const LANGUAGE_LABELS = { en: "English", ja: "Japanese", th: "Thai" };
const languageLabel = code => LANGUAGE_LABELS[code] || code;
const VARIANT_LABELS = {
  normal: "Normal", holo: "Holo", reverse_holo: "Reverse Holo",
  first_edition_normal: "1st Ed. Normal", first_edition_holo: "1st Ed. Holo",
  first_edition: "1st Edition", promo: "Promo",
};
const variantLabel = code => VARIANT_LABELS[code] || code;

// One color per print variant, used for its add-button/badge/stepper so the
// different variants of a card are visually distinguishable at a glance.
const VARIANT_STYLE = {
  normal:               { symbol: "",    color: "#ffcb05", text: "#14151a" },
  holo:                 { symbol: "✵", color: "#38bdf8", text: "#07202b" },
  reverse_holo:         { symbol: "✦", color: "#a78bfa", text: "#1a1330" },
  first_edition_normal: { symbol: "①", color: "#22c55e", text: "#052e13" },
  first_edition_holo:   { symbol: "①✵", color: "#ec4899", text: "#2b0716" },
  first_edition:        { symbol: "①", color: "#2dd4bf", text: "#04211d" },
  promo:                { symbol: "PR",  color: "#fb923c", text: "#2b1300" },
};
function variantStyle(v) {
  return VARIANT_STYLE[v] || { symbol: "", color: "#8b8fa3", text: "#14151a" };
}
// Every trackable print variant for a card — its own `variants` list, plus
// any variant it's already owned under (covers stale data where an owned
// variant no longer appears in a resynced card's variants). Falls back to
// a bare "normal" slot for cards with no variant data at all.
function trackableVariants(card) {
  const fromCard = safeParseList(card.variants);
  const fromOwned = Object.keys(card.owned_by_variant || {});
  const all = Array.from(new Set([...fromCard, ...fromOwned]));
  return all.length ? all : ["normal"];
}

const grid = document.getElementById("grid");
const statusLine = document.getElementById("status-line");
const resultCount = document.getElementById("result-count");

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

async function loadFacets() {
  const res = await fetch("/api/facets");
  const data = await res.json();

  const setSel = document.getElementById("filter-set");
  setSel.innerHTML = '<option value="">All sets</option>' +
    data.sets.map(s => `<option value="${s.id}">${s.name} (${s.card_count})</option>`).join("");

  const raritySel = document.getElementById("filter-rarity");
  raritySel.innerHTML = '<option value="">All rarities</option>' +
    data.rarities.map(r => `<option value="${r}">${r}</option>`).join("");

  const supertypeSel = document.getElementById("filter-supertype");
  supertypeSel.innerHTML = '<option value="">All card types</option>' +
    data.supertypes.map(s => `<option value="${s}">${s}</option>`).join("");

  const typeSel = document.getElementById("filter-type");
  typeSel.innerHTML = '<option value="">All elemental types</option>' +
    data.types.map(t => `<option value="${t}">${t}</option>`).join("");

  const languageSel = document.getElementById("filter-language");
  languageSel.innerHTML = '<option value="">All languages</option>' +
    data.languages.map(l => `<option value="${l}">${languageLabel(l)}</option>`).join("");
  languageSel.value = state.language;
}

function cardEl(card, index) {
  const el = document.createElement("div");
  el.className = "card";
  const img = card.image_filename ? `/images/${card.image_filename}` : "";
  el.innerHTML = `
    <div class="card-img-wrap">
      <img loading="lazy" src="${img}" alt="${card.name}">
      <div class="badges"></div>
      <div class="add-buttons"></div>
    </div>
    <div class="meta">
      <div class="name">${card.name}</div>
      <div class="sub">${card.set_name || ""} · #${card.number || "?"}</div>
    </div>
  `;
  const addButtons = el.querySelector(".add-buttons");
  trackableVariants(card).forEach(variant => {
    const style = variantStyle(variant);
    const btn = document.createElement("button");
    btn.className = "add-btn";
    btn.type = "button";
    btn.title = `Add one (${variantLabel(variant)})`;
    btn.textContent = "+";
    btn.style.setProperty("--variant-color", style.color);
    btn.style.setProperty("--variant-text", style.text);
    btn.addEventListener("click", e => {
      e.stopPropagation();
      quickAdd(index, variant);
    });
    addButtons.appendChild(btn);
  });
  updateBadges(el, card);
  el.addEventListener("click", () => openLightboxAt(index));
  return el;
}

function updateBadges(el, card) {
  const wrap = el.querySelector(".badges");
  wrap.innerHTML = "";
  const owned = card.owned_by_variant || {};
  Object.keys(owned).sort().forEach(variant => {
    const qty = owned[variant];
    if (!qty) return;
    const style = variantStyle(variant);
    const badge = document.createElement("span");
    badge.className = "owned-badge";
    badge.style.setProperty("--variant-color", style.color);
    badge.style.setProperty("--variant-text", style.text);
    badge.textContent = `${style.symbol}×${qty}`;
    wrap.appendChild(badge);
  });
}

function flashWriteError(el) {
  el.classList.add("write-error");
  setTimeout(() => el.classList.remove("write-error"), 1500);
}

// Per (card, variant) promise chain: each write waits for the previous one
// to settle before firing, so rapid clicks can't land out of order at the
// server (two "set quantity to N" requests racing would otherwise let a
// stale one overwrite a newer one). The UI itself updates instantly,
// independent of this chain, so clicking still feels immediate.
const writeChains = new Map();

function queueQuantityWrite(cardId, variant, quantity) {
  const key = `${cardId}:${variant}`;
  const prev = writeChains.get(key) || Promise.resolve();
  const next = prev.then(() => putQuantity(cardId, variant, quantity));
  writeChains.set(key, next);
  return next;
}

async function putQuantity(cardId, variant, quantity) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try {
    const res = await fetch(
      `/api/collection/${encodeURIComponent(cardId)}?quantity=${quantity}&variant=${variant}`,
      { method: "PUT", signal: controller.signal },
    );
    return res.ok;
  } catch {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

async function quickAdd(index, variant) {
  const card = loadedCards[index];
  const owned = card.owned_by_variant || (card.owned_by_variant = {});
  const prevValue = owned[variant] || 0;
  const newValue = prevValue + 1;

  owned[variant] = newValue;
  card.owned_quantity = (card.owned_quantity || 0) + 1;
  const cardElNode = grid.children[index];
  if (cardElNode) updateBadges(cardElNode, card);

  const ok = await queueQuantityWrite(card.id, variant, newValue);
  if (!ok) {
    owned[variant] = prevValue;
    card.owned_quantity = Math.max(0, (card.owned_quantity || 0) - 1);
    if (cardElNode) { updateBadges(cardElNode, card); flashWriteError(cardElNode); }
  }
}

async function adjustQuantity(variant, delta) {
  if (currentIndex < 0) return;
  const card = loadedCards[currentIndex];
  const owned = card.owned_by_variant || (card.owned_by_variant = {});
  const prevValue = owned[variant] || 0;
  const newValue = Math.max(0, prevValue + delta);
  if (newValue === prevValue) return;

  owned[variant] = newValue;
  card.owned_quantity = (card.owned_quantity || 0) + (newValue - prevValue);
  renderQtyStepper(card);
  const cardElNode = grid.children[currentIndex];
  if (cardElNode) updateBadges(cardElNode, card);

  const ok = await queueQuantityWrite(card.id, variant, newValue);
  if (!ok) {
    owned[variant] = prevValue;
    card.owned_quantity = (card.owned_quantity || 0) - (newValue - prevValue);
    renderQtyStepper(card);
    if (cardElNode) updateBadges(cardElNode, card);
    flashWriteError(document.getElementById("lightbox-collection"));
  }
}

function renderQtyStepper(card) {
  const wrap = document.getElementById("lightbox-collection");
  wrap.innerHTML = "";
  const owned = card.owned_by_variant || {};
  trackableVariants(card).forEach(variant => {
    const style = variantStyle(variant);
    const row = document.createElement("div");
    row.className = "qty-row";
    row.style.setProperty("--variant-color", style.color);
    row.style.setProperty("--variant-text", style.text);
    row.innerHTML = `
      <span class="label">${variantLabel(variant)}</span>
      <button type="button" aria-label="Remove one ${variantLabel(variant)}">&minus;</button>
      <span class="qty-value">${owned[variant] || 0}</span>
      <button type="button" aria-label="Add one ${variantLabel(variant)}">+</button>
    `;
    const [minusBtn, plusBtn] = row.querySelectorAll("button");
    minusBtn.addEventListener("click", () => adjustQuantity(variant, -1));
    plusBtn.addEventListener("click", () => adjustQuantity(variant, 1));
    wrap.appendChild(row);
  });
}

function safeParseList(value) {
  if (!value) return [];
  try {
    const parsed = JSON.parse(value);
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}

function renderLightbox(card) {
  document.getElementById("lightbox-img").src = card.image_filename ? `/images/${card.image_filename}` : "";
  document.getElementById("lightbox-img").alt = card.name || "";
  document.getElementById("d-name").textContent = card.name || "";
  document.getElementById("d-set-line").textContent =
    [card.set_name, card.series].filter(Boolean).join(" · ") || "";
  renderQtyStepper(card);

  const types = safeParseList(card.types);
  const subtypes = safeParseList(card.subtypes);
  const variants = safeParseList(card.variants);
  const rows = [
    ["Card #", card.number],
    ["Pokédex #", card.pokedex_number],
    ["Language", card.language ? languageLabel(card.language) : null],
    ["Supertype", card.supertype],
    ["Subtypes", subtypes.join(", ")],
    ["Types", types.join(", ")],
    ["HP", card.hp],
    ["Rarity", card.rarity],
    ["Print Variants", variants.map(variantLabel).join(", ")],
    ["Artist", card.artist],
  ].filter(([, value]) => value);

  document.getElementById("d-meta").innerHTML =
    rows.map(([label, value]) => `<dt>${label}</dt><dd>${value}</dd>`).join("");

  document.getElementById("lightbox-prev").disabled = currentIndex <= 0;
  document.getElementById("lightbox-next").disabled =
    currentIndex >= loadedCards.length - 1 && state.page > pages;
}

async function openLightboxAt(index) {
  if (index < 0) return;
  if (index >= loadedCards.length) {
    if (state.page > pages) return;
    await loadMore();
    if (index >= loadedCards.length) return;
  }
  currentIndex = index;
  renderLightbox(loadedCards[currentIndex]);
  document.getElementById("lightbox").classList.add("visible");
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("visible");
  document.body.style.overflow = "";
}

document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target.id === "lightbox") closeLightbox();
});
document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
document.getElementById("lightbox-prev").addEventListener("click", () => openLightboxAt(currentIndex - 1));
document.getElementById("lightbox-next").addEventListener("click", () => openLightboxAt(currentIndex + 1));

document.addEventListener("keydown", e => {
  if (!document.getElementById("lightbox").classList.contains("visible")) return;
  if (e.key === "Escape") closeLightbox();
  else if (e.key === "ArrowLeft") openLightboxAt(currentIndex - 1);
  else if (e.key === "ArrowRight") openLightboxAt(currentIndex + 1);
});

async function resetAndLoad() {
  state.page = 1;
  grid.innerHTML = "";
  loadedCards = [];
  currentIndex = -1;
  await loadMore();
}

async function loadMore() {
  if (loading || state.page > pages) return;
  loading = true;
  statusLine.textContent = "Loading…";

  const params = new URLSearchParams({
    search: state.search, set: state.set, rarity: state.rarity,
    supertype: state.supertype, type: state.type, language: state.language,
    has_variant: state.hasVariant, owned: state.owned, sort: state.sort, order: state.order,
    page: state.page, page_size: 60,
  });
  const res = await fetch(`/api/cards?${params}`);
  const data = await res.json();
  pages = data.pages;

  resultCount.textContent = `${data.total.toLocaleString()} card${data.total === 1 ? "" : "s"}`;
  data.items.forEach(card => {
    const index = loadedCards.length;
    loadedCards.push(card);
    grid.appendChild(cardEl(card, index));
  });

  statusLine.textContent = state.page >= pages ? (data.total ? "End of results" : "No cards match") : "";
  state.page += 1;
  loading = false;
}

const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) loadMore();
}, { rootMargin: "600px" });
observer.observe(document.getElementById("sentinel"));

document.getElementById("search").addEventListener("input", debounce(e => {
  state.search = e.target.value;
  resetAndLoad();
}, 300));

for (const [id, key] of [["filter-set", "set"], ["filter-rarity", "rarity"],
                          ["filter-supertype", "supertype"], ["filter-type", "type"],
                          ["filter-language", "language"], ["filter-has-variant", "hasVariant"],
                          ["sort-field", "sort"], ["sort-order", "order"]]) {
  document.getElementById(id).addEventListener("change", e => {
    state[key] = e.target.value;
    if (key === "set") updateMasterSetLink();
    resetAndLoad();
  });
}

function updateMasterSetLink() {
  const link = document.getElementById("master-set-link");
  if (state.set) {
    link.href = `/master/${encodeURIComponent(state.set)}`;
    link.hidden = false;
  } else {
    link.hidden = true;
  }
}

document.getElementById("filter-owned").addEventListener("change", e => {
  state.owned = e.target.checked;
  resetAndLoad();
});

async function pollSyncStatus() {
  const res = await fetch("/api/sync-status");
  const { pokemontcg: en, tcgdex } = await res.json();
  const banner = document.getElementById("sync-banner");
  const enBtn = document.getElementById("sync-en-btn");
  const tcgdexBtn = document.getElementById("sync-tcgdex-btn");

  enBtn.disabled = en.running;
  tcgdexBtn.disabled = tcgdex.running;

  const lines = [];
  let refreshNeeded = false;

  if (en.running) {
    pokemontcgWasRunning = true;
    const setProgress = en.total_sets
      ? ` (set ${en.sets_done}/${en.total_sets}${en.current_set ? ": " + en.current_set : ""})` : "";
    lines.push(`Syncing English cards…${setProgress} ${en.cards_synced.toLocaleString()} cards, ${en.images_downloaded.toLocaleString()} images`);
  } else if (pokemontcgWasRunning) {
    pokemontcgWasRunning = false;
    lines.push(en.last_error ? `English sync failed: ${en.last_error}` : "English sync complete");
    refreshNeeded = true;
  } else if (!en.has_data) {
    lines.push("No English cards cached yet.");
  }

  if (tcgdex.running) {
    tcgdexWasRunning = true;
    const langPart = tcgdex.language ? `${languageLabel(tcgdex.language)}, ` : "";
    const setProgress = tcgdex.total_sets
      ? ` (${langPart}set ${tcgdex.sets_done}/${tcgdex.total_sets}${tcgdex.current_set ? ": " + tcgdex.current_set : ""})` : "";
    lines.push(`Syncing Japanese/Thai cards…${setProgress} ${tcgdex.cards_synced.toLocaleString()} cards, ${tcgdex.images_downloaded.toLocaleString()} images`);
  } else if (tcgdexWasRunning) {
    tcgdexWasRunning = false;
    lines.push(tcgdex.last_error ? `Japanese/Thai sync failed: ${tcgdex.last_error}` : "Japanese/Thai sync complete");
    refreshNeeded = true;
  }

  if (lines.length) {
    banner.innerHTML = lines.map(l => `<div>${l}</div>`).join("");
    banner.classList.add("visible");
    if (refreshNeeded && !en.running && !tcgdex.running) {
      setTimeout(() => banner.classList.remove("visible"), 6000);
    }
  } else {
    banner.classList.remove("visible");
  }

  if (refreshNeeded) {
    loadFacets();
    resetAndLoad();
  }
}

document.getElementById("sync-en-btn").addEventListener("click", async () => {
  await fetch("/api/sync?source=pokemontcg", { method: "POST" });
  pollSyncStatus();
});
document.getElementById("sync-tcgdex-btn").addEventListener("click", async () => {
  await fetch("/api/sync?source=tcgdex", { method: "POST" });
  pollSyncStatus();
});

loadFacets();
updateMasterSetLink();
resetAndLoad();
pollSyncStatus();
setInterval(pollSyncStatus, 4000);
</script>
</body>
