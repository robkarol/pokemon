<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Set Checklist</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14151a;
    --panel: #1d1f27;
    --border: #2c2f3a;
    --text: #e8e9ee;
    --muted: #8b8fa3;
    --accent: #ffcb05;
    --accent-text: #14151a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .back-link:hover { color: var(--accent); }
  h1 {
    font-size: 1.3rem;
    margin: 0.35rem 0 0.15rem;
  }
  .set-sub {
    color: var(--muted);
    font-size: 0.85rem;
  }
  #progress-wrap {
    margin-top: 0.75rem;
  }
  #progress-text {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }
  #progress-bar {
    height: 8px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.2s ease;
  }
  #list {
    max-width: 820px;
    margin: 0 auto;
    padding: 1rem 1.5rem 3rem;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.6rem 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  .row img {
    width: 42px;
    height: 58px;
    object-fit: contain;
    background: #0c0d10;
    border-radius: 4px;
    flex-shrink: 0;
    color: transparent;
    font-size: 0;
  }
  .row .info {
    flex: 1 1 auto;
    min-width: 0;
  }
  .row .name {
    font-size: 0.92rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .sub {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .slots {
    display: flex;
    gap: 0.6rem;
    flex-shrink: 0;
  }
  .slot {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.78rem;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .slot input {
    width: 1.1rem;
    height: 1.1rem;
    cursor: pointer;
    accent-color: var(--accent);
  }
  .slot.checked { color: var(--text); font-weight: 600; }
  .row.write-error { outline: 2px solid #ef4444; outline-offset: -2px; }
  #status-line {
    text-align: center;
    color: var(--muted);
    padding: 2rem;
  }
</style>
</head>
<body>

<header>
  <a class="back-link" href="/cards">&larr; Back to gallery</a>
  <h1 id="set-name">Loading…</h1>
  <div class="set-sub" id="set-sub"></div>
  <div id="progress-wrap">
    <div id="progress-text"></div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>
</header>

<div id="list"></div>
<div id="status-line"></div>

<script>
const setId = decodeURIComponent(window.location.pathname.split("/").filter(Boolean).pop());
const list = document.getElementById("list");

function safeParseList(value) {
  if (!value) return [];
  try {
    const parsed = JSON.parse(value);
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}

const VARIANT_LABELS = {
  normal: "Normal", holo: "Holo", reverse_holo: "Reverse Holo",
  first_edition_normal: "1st Ed. Normal", first_edition_holo: "1st Ed. Holo",
  first_edition: "1st Edition", promo: "Promo",
};
function variantLabel(v) { return VARIANT_LABELS[v] || v; }

// Every print variant actually released for this card is its own checklist
// item — a card released as both Unlimited Holo and 1st Edition Holo, say,
// gets two separate checkboxes, since those are two distinct collectible
// prints, not two flags on the same one.
function trackableSlots(card) {
  const variants = safeParseList(card.variants);
  const owned = card.owned_by_variant || {};
  const keys = variants.length ? variants : (Object.keys(owned).length ? Object.keys(owned) : ["normal"]);
  return keys.map(variant => ({ variant, label: variantLabel(variant), owned: owned[variant] || 0 }));
}

function updateProgress(cards) {
  let total = 0, collected = 0;
  cards.forEach(card => {
    trackableSlots(card).forEach(slot => {
      total += 1;
      if (slot.owned > 0) collected += 1;
    });
  });
  const pct = total ? Math.round((collected / total) * 100) : 0;
  document.getElementById("progress-text").textContent = `${collected} / ${total} collected (${pct}%)`;
  document.getElementById("progress-fill").style.width = `${pct}%`;
}

const writeChains = new Map();
function queueQuantityWrite(cardId, variant, quantity) {
  const key = `${cardId}:${variant}`;
  const prev = writeChains.get(key) || Promise.resolve();
  const next = prev.then(() => putQuantity(cardId, variant, quantity));
  writeChains.set(key, next);
  return next;
}

async function putQuantity(cardId, variant, quantity) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try {
    const res = await fetch(
      `/api/collection/${encodeURIComponent(cardId)}?quantity=${quantity}&variant=${variant}`,
      { method: "PUT", signal: controller.signal },
    );
    return res.ok;
  } catch {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

let cardsData = [];

function rowEl(card) {
  const el = document.createElement("div");
  el.className = "row";
  const img = card.image_filename ? `/images/${card.image_filename}` : "";
  el.innerHTML = `
    <img loading="lazy" src="${img}" alt="${card.name}">
    <div class="info">
      <div class="name">${card.name}</div>
      <div class="sub">#${card.number || "?"} &middot; ${card.rarity || ""}</div>
    </div>
    <div class="slots"></div>
  `;
  const slotsEl = el.querySelector(".slots");
  trackableSlots(card).forEach(slot => {
    const label = document.createElement("label");
    label.className = "slot" + (slot.owned > 0 ? " checked" : "");
    label.innerHTML = `<input type="checkbox" ${slot.owned > 0 ? "checked" : ""}> ${slot.label}`;
    const checkbox = label.querySelector("input");
    checkbox.addEventListener("change", async () => {
      const newQty = checkbox.checked ? 1 : 0;
      const owned = card.owned_by_variant || (card.owned_by_variant = {});
      const prevOwned = owned[slot.variant] || 0;
      owned[slot.variant] = newQty;
      label.classList.toggle("checked", newQty > 0);
      updateProgress(cardsData);

      const ok = await queueQuantityWrite(card.id, slot.variant, newQty);
      if (!ok) {
        checkbox.checked = !checkbox.checked;
        owned[slot.variant] = prevOwned;
        label.classList.toggle("checked", prevOwned > 0);
        updateProgress(cardsData);
        el.classList.add("write-error");
        setTimeout(() => el.classList.remove("write-error"), 1500);
      }
    });
    slotsEl.appendChild(label);
  });
  return el;
}

async function load() {
  const statusLine = document.getElementById("status-line");
  const res = await fetch(`/api/sets/${encodeURIComponent(setId)}/master`);
  if (!res.ok) {
    statusLine.textContent = "Set not found.";
    document.getElementById("set-name").textContent = "Not found";
    return;
  }
  const data = await res.json();
  cardsData = data.cards;

  document.getElementById("set-name").textContent = data.set.name || setId;
  const langLabel = { en: "English", ja: "Japanese", th: "Thai" }[data.set.language] || data.set.language;
  document.getElementById("set-sub").textContent =
    [data.set.series, data.set.release_date, langLabel].filter(Boolean).join(" · ");
  document.title = `${data.set.name || setId} — Master Set`;

  list.innerHTML = "";
  cardsData.forEach(card => list.appendChild(rowEl(card)));
  updateProgress(cardsData);
  statusLine.textContent = cardsData.length ? "" : "No cards found for this set.";
}

load();
</script>
</body>
</html>
