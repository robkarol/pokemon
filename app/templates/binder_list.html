<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Binders</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14151a;
    --panel: #1d1f27;
    --border: #2c2f3a;
    --text: #e8e9ee;
    --muted: #8b8fa3;
    --accent: #ffcb05;
    --accent-text: #14151a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .back-link:hover { color: var(--accent); }
  h1 {
    font-size: 1.25rem;
    margin: 0;
    white-space: nowrap;
  }
  h1 .accent { color: var(--accent); }
  #new-binder-form {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  #new-binder-name {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.7rem;
    font-size: 0.9rem;
    min-width: 240px;
    flex: 1 1 240px;
    max-width: 400px;
  }
  #new-binder-form button[type=submit] {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 6px;
    padding: 0.5rem 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  #new-binder-form button[type=submit]:disabled { opacity: 0.5; cursor: default; }
  .swatch-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .swatch {
    width: 1.5rem;
    height: 1.5rem;
    border-radius: 50%;
    border: 2px solid transparent;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
    cursor: pointer;
    padding: 0;
  }
  .swatch.selected { border-color: #fff; }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 1.6rem;
    padding: 1.5rem;
    max-width: 1200px;
  }
  .binder-cover {
    position: relative;
    aspect-ratio: 3 / 4;
    background:
      linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0) 40%),
      linear-gradient(135deg, #333648, #1a1c25 65%);
    border: 1px solid var(--border);
    border-radius: 6px 10px 10px 6px;
    padding: 1rem 1rem 1rem 2rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(0,0,0,0.4);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    text-decoration: none;
    color: var(--text);
    overflow: hidden;
  }
  .binder-cover::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 1.4rem;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--binder-color, #454859) 60%, #454859), #23252f);
    box-shadow: inset -3px 0 6px rgba(0,0,0,0.4);
  }
  .binder-cover:hover {
    transform: translateY(-5px) rotate(-0.5deg);
    box-shadow: 0 16px 30px rgba(0,0,0,0.5), 0 0 0 1.5px var(--binder-color, var(--accent));
  }
  .binder-cover.editing {
    cursor: default;
  }
  .binder-cover .edit-btn {
    position: absolute;
    top: 0.5rem;
    right: 2.4rem;
    width: 1.7rem;
    height: 1.7rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(20,21,26,0.75);
    color: var(--muted);
    font-size: 0.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .binder-cover .edit-btn:hover { border-color: var(--accent); color: var(--accent); }
  .binder-cover .edit-panel {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .binder-cover .edit-panel input[type=text] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.3rem 0.4rem;
    font-size: 0.85rem;
    width: 100%;
  }
  .binder-cover .edit-panel .edit-actions {
    display: flex;
    gap: 0.4rem;
  }
  .binder-cover .edit-panel button {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem;
    font-size: 0.78rem;
    cursor: pointer;
    background: var(--panel);
    color: var(--text);
  }
  .binder-cover .edit-panel button.save { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .binder-rings {
    position: absolute;
    left: 0.45rem;
    top: 0.6rem;
    bottom: 0.6rem;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    z-index: 1;
  }
  .binder-rings span {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #14151a;
    border: 1px solid #565a6c;
  }
  .binder-cover .label {
    background: #eef0f5;
    color: #1a1b22;
    border-radius: 4px;
    padding: 0.55rem 0.5rem;
    font-weight: 700;
    font-size: 0.95rem;
    line-height: 1.2;
    text-align: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    word-break: break-word;
    margin-top: 1.6rem;
  }
  .binder-cover .stats {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .binder-cover .stats b { color: var(--text); }
  .binder-cover .delete-btn {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    width: 1.7rem;
    height: 1.7rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(20,21,26,0.75);
    color: var(--muted);
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .binder-cover .delete-btn:hover { border-color: #ef4444; color: #ef4444; }
  #status-line {
    padding: 1.5rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <a class="back-link" href="/cards">&larr; Gallery</a>
  <h1>My <span class="accent">Binders</span></h1>
</header>

<form id="new-binder-form">
  <input id="new-binder-name" type="text" placeholder="New binder name…" maxlength="100" required>
  <div class="swatch-row" id="new-binder-swatches"></div>
  <button type="submit">+ Create Binder</button>
</form>

<div id="grid"></div>
<div id="status-line"></div>

<script>
const grid = document.getElementById("grid");
const statusLine = document.getElementById("status-line");
let binderColors = ["#ffcb05"];
let newBinderColor = binderColors[0];

function swatchRowEl(selectedColor, onSelect) {
  const row = document.createElement("div");
  row.className = "swatch-row";
  binderColors.forEach(color => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "swatch" + (color === selectedColor ? " selected" : "");
    btn.style.background = color;
    btn.title = color;
    btn.addEventListener("click", e => {
      e.preventDefault();
      row.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
      btn.classList.add("selected");
      onSelect(color);
    });
    row.appendChild(btn);
  });
  return row;
}

function binderCoverEl(binder) {
  const a = document.createElement("a");
  a.className = "binder-cover";
  a.href = `/binder/${binder.id}`;
  a.style.setProperty("--binder-color", binder.color);
  a.innerHTML = `
    <button class="edit-btn" type="button" title="Edit binder">&#9998;</button>
    <button class="delete-btn" type="button" title="Delete binder">&times;</button>
    <div class="binder-rings"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="label"></div>
    <div class="stats">
      <span>📄 <b>${binder.page_count}</b> page${binder.page_count === 1 ? "" : "s"}</span>
      <span>🃏 <b>${binder.filled_count}</b> card${binder.filled_count === 1 ? "" : "s"}</span>
    </div>
  `;
  a.querySelector(".label").textContent = binder.name;
  a.querySelector(".delete-btn").addEventListener("click", async e => {
    e.preventDefault();
    e.stopPropagation();
    if (!confirm(`Delete "${binder.name}"? This can't be undone.`)) return;
    const res = await fetch(`/api/binders/${binder.id}`, { method: "DELETE" });
    if (res.ok) a.remove();
  });
  a.querySelector(".edit-btn").addEventListener("click", e => {
    e.preventDefault();
    e.stopPropagation();
    openEditPanel(a, binder);
  });
  return a;
}

function openEditPanel(a, binder) {
  a.classList.add("editing");
  a.querySelectorAll(".edit-btn, .delete-btn, .label, .stats").forEach(el => el.hidden = true);

  let pendingColor = binder.color;
  const panel = document.createElement("div");
  panel.className = "edit-panel";
  panel.innerHTML = `
    <input type="text" maxlength="100" value="${binder.name.replace(/"/g, "&quot;")}">
    <div class="edit-actions">
      <button type="button" class="cancel">Cancel</button>
      <button type="button" class="save">Save</button>
    </div>
  `;
  const nameInput = panel.querySelector("input");
  const swatches = swatchRowEl(pendingColor, c => { pendingColor = c; });
  panel.insertBefore(swatches, panel.querySelector(".edit-actions"));
  a.appendChild(panel);
  nameInput.focus();
  nameInput.select();

  function close() {
    panel.remove();
    a.classList.remove("editing");
    a.querySelectorAll(".edit-btn, .delete-btn, .label, .stats").forEach(el => el.hidden = false);
  }

  panel.addEventListener("click", e => e.preventDefault());
  panel.querySelector(".cancel").addEventListener("click", e => {
    e.preventDefault();
    close();
  });
  panel.querySelector(".save").addEventListener("click", async e => {
    e.preventDefault();
    const newName = nameInput.value.trim();
    if (!newName) return;
    const params = new URLSearchParams({ name: newName, color: pendingColor });
    const res = await fetch(`/api/binders/${binder.id}?${params}`, { method: "PATCH" });
    if (res.ok) {
      const updated = await res.json();
      binder.name = updated.name;
      binder.color = updated.color;
      a.style.setProperty("--binder-color", updated.color);
      a.querySelector(".label").textContent = updated.name;
    }
    close();
  });
}

async function load() {
  const res = await fetch("/api/binders");
  const binders = await res.json();
  grid.innerHTML = "";
  binders.forEach(b => grid.appendChild(binderCoverEl(b)));
  statusLine.textContent = binders.length ? "" : "No binders yet — create one above.";
}

async function loadColors() {
  const res = await fetch("/api/binders/colors");
  binderColors = await res.json();
  newBinderColor = binderColors[0];
  const row = swatchRowEl(newBinderColor, c => { newBinderColor = c; });
  document.getElementById("new-binder-swatches").replaceWith(row);
  row.id = "new-binder-swatches";
}

document.getElementById("new-binder-form").addEventListener("submit", async e => {
  e.preventDefault();
  const input = document.getElementById("new-binder-name");
  const name = input.value.trim();
  if (!name) return;
  const submitBtn = e.target.querySelector("button[type=submit]");
  submitBtn.disabled = true;
  try {
    const params = new URLSearchParams({ name, color: newBinderColor });
    const res = await fetch(`/api/binders?${params}`, { method: "POST" });
    if (res.ok) {
      input.value = "";
      await load();
    }
  } finally {
    submitBtn.disabled = false;
  }
});

loadColors();
load();
</script>
</body>
</html>
